name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXTRADE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/nextrade_test
      NEXTRADE_TEST_DB_USERNAME: nextrade_test
      NEXTRADE_TEST_DB_PASSWORD: nextrade_test_password

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nextrade_test
          POSTGRES_USER: nextrade_test
          POSTGRES_PASSWORD: nextrade_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextrade_test -d nextrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
